    استخدام الهمزات الصحيحة وعدم إضافة عبارات وصفية ليست جزءاً من الاسم الرسمي.'
  en: Official full Arabic name of the mosque (e.g. جامع..., مسجد...). Ensure standard
    Arabic spelling without extraneous descriptive text.
